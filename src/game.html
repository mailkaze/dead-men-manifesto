const BLD=__ASSET_JSON:assets/street/buildings.json__,GIMG=new Image();GIMG.src='__ASSET:assets/street/ground.png__';const GW=191,GH=106,GY=224-GH,GAP=24;
let cyc=0;for(const b of BLD){b.img=new Image();b.img.src=b.src;b.x=cyc+GAP/2;cyc+=b.w+GAP}
const GFLIP=mk(GW,GH);GIMG.onload=()=>{const x=GFLIP.getContext('2d');x.translate(GW,0);x.scale(-1,1);x.drawImage(GIMG,0,0)};
const SKYW=305,SKYH=124,SKYI=new Image(),SKYF=mk(SKYW,SKYH);SKYI.onload=()=>{const x=SKYF.getContext('2d');x.translate(SKYW,0);x.scale(-1,1);x.drawImage(SKYI,0,0)};SKYI.src='__ASSET:assets/street/skyline.png__';
function drawStreetBg(cx){const p=cx*.3,s0=Math.floor(p/SKYW);for(let i=s0;i*SKYW-p<V;i++)ctx.drawImage(i%2?SKYF:SKYI,Math.round(i*SKYW-p),GY+3-SKYH);
 const g0=Math.floor(cx/GW);for(let i=g0;i*GW-cx<V;i++)ctx.drawImage(i%2?GFLIP:GIMG,i*GW-cx,GY);
 const k0=Math.floor((cx-500)/cyc),k1=Math.floor((cx+V)/cyc);
 for(let k=Math.max(0,k0);k<=k1;k++)for(const b of BLD){const X=Math.round(k*cyc+b.x-cx);if(X>V||X+b.w<0)continue;ctx.drawImage(b.img,X,GY+3-b.h)}}
function streetHS(){const k=Math.floor(pl.x/cyc);let best=null,bd=1e9;for(let kk=k-1;kk<=k+1;kk++)for(const b of BLD){const hx=kk*cyc+b.x+b.door,hy=GY+12,d=Math.hypot(pl.x-hx,(pl.y-hy)*1.5);if(d<18&&d<bd){bd=d;best={t:[b.t]}}}return best}
SCN.street={drawBg:drawStreetBg,w:Infinity,h:224,oy:0,poly:[[4,GY+9],[1e9,GY+9],[1e9,GY+47],[4,GY+47]],bpoly:[[-60,GY+2],[1e9,GY+2],[1e9,240],[-60,240]],hs:[],hsFn:streetHS,tint:1,dust:'#c8a8a0',shadow:'rgba(30,14,30,.35)',
 exits:[{x0:-99,x1:9,y0:0,y1:999,dir:'left',to:'room',spawn:[155,146,'up']}],marks:[[9,GY+28]]};
SCN.room.exits[0].spawn=[34,GY+28,'right'];
// ---------- traffic ----------
const VEH=__ASSET_JSON:assets/vehicles/vehicles.json__;
function tintCanvas(img,w,h){const c=mk(w,h),x=c.getContext('2d');x.drawImage(img,0,0);const id=x.getImageData(0,0,w,h),d=id.data;for(let i=0;i<d.length;i+=4){d[i]=Math.min(255,d[i]*.92+8);d[i+1]=d[i+1]*.82;d[i+2]=d[i+2]*.8}x.putImageData(id,0,0);return c}
for(const v of VEH){v.B=new Image();v.S=new Image();v.B.onload=()=>{v.BT=tintCanvas(v.B,v.w,v.h)};v.S.onload=()=>{v.ST=tintCanvas(v.S,v.S.width,v.S.height)};v.B.src=v.body;v.S.src=v.strip}
const LANES=[{y:GY+77,dir:-1},{y:GY+105,dir:1}];let cars=[],laneT=[1.5,3.5];
function trafficUpdate(dt,cx){
 for(let l=0;l<2;l++){laneT[l]-=dt;if(laneT[l]<=0){laneT[l]=2.2+Math.random()*4.5;const v=VEH[Math.floor(Math.random()*VEH.length)],L=LANES[l],x=L.dir<0?cx+V+20:cx-v.w-20;
  if(!cars.some(c=>c.l===l&&(L.dir<0?c.x+c.k.w>x-60:c.x<x+v.w+60)))cars.push({l,x,k:v,v:v.speed[0]+Math.random()*(v.speed[1]-v.speed[0]),cur:0,d:0,seed:Math.random()*9,pt:0})}}
 for(const c of cars){const L=LANES[c.l];let sp=c.v;for(const o of cars)if(o!==c&&o.l===c.l){const gap=L.dir>0?o.x-(c.x+c.k.w):c.x-(o.x+o.k.w);if(gap>-5&&gap<28)sp=Math.min(sp,o.cur||o.v)}
  c.cur=sp;c.x+=L.dir*sp*dt;c.d+=sp*dt;
  if(c.k.exhaust){c.pt-=dt;if(c.pt<=0){c.pt=.12+Math.random()*.15;const rx=L.dir>0?c.x+3:c.x+c.k.w-3;parts.push({x:rx,y:L.y-9,vx:-L.dir*(10+Math.random()*10),vy:-6-Math.random()*6,g:0,life:.6,max:.6,col:'#8a8090',sz:1})}}}
 cars=cars.filter(c=>c.x>cx-c.k.w-320&&c.x<cx+V+320)}
function drawCars(cx){const order=[...cars].sort((a,b)=>a.l-b.l);
 for(const c of order){const v=c.k;if(!v.BT||!v.ST)continue;const L=LANES[c.l],X=Math.round(c.x-cx),Y=L.y-v.wb;if(X>V||X+v.w<0)continue;
  ctx.fillStyle='rgba(10,6,14,.38)';ctx.fillRect(X+8,L.y-3,v.w-16,4);ctx.fillRect(X+14,L.y+1,v.w-28,2);
  const bob=Math.round(Math.sin(c.d*.13+c.seed)*.6),fr=Math.floor(c.d/v.r/(Math.PI/6))%12,flip=L.dir<0;
  ctx.save();if(flip){ctx.translate(X+v.w,0);ctx.scale(-1,1)}else ctx.translate(X,0);
  ctx.drawImage(v.BT,0,Y+bob);v.wheels.forEach((wd,k)=>ctx.drawImage(v.ST,fr*v.fw,k*v.fh,wd.w,wd.h,wd.x,Y+wd.y,wd.w,wd.h));ctx.restore()}}


function inPoly(x,y,P=(SCN[scene]||{}).poly||RPOLY){let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const [xi,yi]=P[i],[xj,yj]=P[j];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))c=!c}return c}
function nearHS(){const SC=SCN[scene];if(!SC)return null;if(SC.hsFn)return SC.hsFn();let best=null,bd=1e9;for(const h of SC.hs){const d=Math.hypot(pl.x-h.x,pl.y-h.y);if(d<h.r&&d<bd){bd=d;best=h}}return best}

function setScene(s,spawn){scene=s;bullets=[];parts=[];cars=[];laneT=[1.2,2.8];pl.shootT=0;
 if(SCN[s]){lastStory=s;const sp=spawn||(s==='room'?[150,126,'down']:[150,100,'down']);pl.x=sp[0];pl.y=sp[1];pl.dir=sp[2]}
 else{pl.x=240;pl.y=260;pl.dir='down';if(!fieldIntro){fieldIntro=true;say(['JESSICA: Campo de pruebas. Esas cajas no deberían estar aquí... Voy a revisarlas.'])}}
 document.getElementById('scn').textContent=SCN[s]?'Ir al campo de pruebas ▸':'◂ Volver a la historia'}
function startFade(to,spawn){fade={t:0,to,spawn,done:false};pl.cd=.4}

// ---------- update ----------
function update(dt){t+=dt;if(fade){fade.t+=dt;if(!fade.done&&fade.t>=.3){fade.done=true;setScene(fade.to,fade.spawn)}if(fade.t>=.62)fade=null;inp.aPress=false;return}
 if(dlgUpdate(dt)){pl.moving=false;for(const p of parts){p.life-=dt}parts=parts.filter(p=>p.life>0);return}let mx=inp.jx,my=inp.jy;
 const kx=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0),ky=(keys.ArrowDown||keys.KeyS?1:0)-(keys.ArrowUp||keys.KeyW?1:0);if(kx||ky){mx=kx;my=ky}
 const m=Math.min(1,Math.hypot(mx,my));
 if(pl.cd>0)pl.cd-=dt;if(pl.shootT>0)pl.shootT-=dt;
 const hs=nearHS();if(inp.aPress&&hs&&pl.shootT<=0){inp.aPress=false;inp.a=false;say(hs.t);return}
 if((inp.aPress||inp.a!==false)&&pl.cd<=0&&!hs)shoot();inp.aPress=false;
 const moving=m>0.15;
 if(m>0.15&&pl.shootT<=0.02){if(Math.abs(mx)>Math.abs(my)*1.1){pl.dir=mx>0?'right':'left'}else{pl.dir=my>0?'down':'up'}}
 if(moving){const run=inp.b!==false||runLock,sp=(run?125:73)*Math.max(.55,m)*(pl.shootT>0?.85:1),n=Math.hypot(mx,my)||1,dx=mx/n*sp*dt,dy=my/n*sp*dt;
  if(!hitSolid(pl.x+dx,pl.y))pl.x+=dx;if(!hitSolid(pl.x,pl.y+dy))pl.y+=dy;
  pl.walkT+=dt*(run?17:11);const fi=Math.floor(pl.walkT)%4;if(fi!==pl.lastStep){pl.lastStep=fi;if(fi===0||fi===2)puff(pl.x+(fi?3:-3),pl.y-1,run?5:2,SCN[scene]?SCN[scene].dust:'#d8d0a8',run?18:10,.3)}}
 else{pl.walkT=0;pl.lastStep=-1}
 pl.moving=moving;pl.running=inp.b!==false||runLock;
 {const SC=SCN[scene];if(SC&&moving)for(const e of SC.exits)if(pl.x>=e.x0&&pl.x<=e.x1&&pl.y>=e.y0&&pl.y<=e.y1&&(e.dir==='down'?my>.3:e.dir==='up'?my<-.3:e.dir==='left'?mx<-.3:mx>.3)){startFade(e.to,e.spawn);break}}
 {const side=pl.dir==='left'||pl.dir==='right';let tg=moving?(pl.running?2.6:1.7)*Math.sin(pl.walkT*Math.PI/2):0.8*Math.sin(t*2.2);if(moving&&side&&!pl.running)tg-=0.9;
  tailV+=((tg-tailS)*70-tailV*9)*dt;tailS+=tailV*dt;tailS=Math.max(-3.4,Math.min(3.4,tailS))}
 for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
  const gy=b.y+b.h;if(scene==='field')for(const c of crates)if(!c.broken&&b.x>c.x-8&&b.x<c.x+8&&gy>c.y-10&&gy<c.y+3){b.life=0;c.hp--;c.flash=.08;c.shake=.15;puff(b.x,b.y,5,'#ffe9a0',35,.2);
   if(c.hp<=0){if(!said){said=true;setTimeout(()=>say(['JESSICA: Vacía... Alguien se llevó lo que había dentro antes que yo.']),500)}c.broken=true;c.resp=3;shake=.15;puff(c.x,c.y-8,14,'#c08850',60,.7,1,2);puff(c.x,c.y-8,8,'#7a4c28',45,.6,1,1)}}
  if(SCN[scene]&&!inPoly(b.x,gy,SCN[scene].bpoly)){b.life=0;puff(b.x,b.y,4,'#e8d0a0',18,.25)}
  if(scene==='field')for(const tr of trees)if(Math.abs(b.x-tr.x)<7&&gy>tr.y-7&&gy<tr.y+2){b.life=0;puff(b.x,b.y,6,'#8cc45a',30,.4,1)}
  if(b.life<=0&&b.life>-1){if(b.life>-.001)puff(b.x,b.y,3,'#e8e0c0',15,.2);b.life=-2}}
 bullets=bullets.filter(b=>b.life>0);
 for(const c of crates){if(c.flash>0)c.flash-=dt;if(c.shake>0)c.shake-=dt;if(c.broken){c.resp-=dt;if(c.resp<=0){c.broken=false;c.hp=3;puff(c.x,c.y-8,8,'#ffffff',20,.3)}}}
 if(scene==='street')trafficUpdate(dt,Math.max(0,pl.x-V/2));
 for(const p of parts){p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.floor&&p.y>p.floor){p.y=p.floor;p.vy*=-.35;p.vx*=.5}p.life-=dt}
 parts=parts.filter(p=>p.life>0);if(shake>0)shake-=dt;if(pl.muz)pl.muz.t-=dt}
// ---------- draw ----------
function draw(){let cx,cy;const SC=SCN[scene];if(SC){cx=SC.w<=V?-Math.round((V-SC.w)/2):Math.round(Math.min(SC.w-V,Math.max(0,pl.x-V/2)));cy=SC.h<=V?-SC.oy:Math.round(Math.min(SC.h-V,Math.max(0,pl.y-30-V/2)))}else{cx=Math.round(Math.min(MAPW-V,Math.max(0,pl.x-V/2)));cy=Math.round(Math.min(MAPH-V,Math.max(0,pl.y-30-V/2)))}
 if(shake>0){cx+=Math.random()<.5?-1:1;cy+=Math.random()<.5?-1:1}
 if(SC){ctx.fillStyle='#000';ctx.fillRect(0,0,V,V);if(SC.drawBg)SC.drawBg(cx);else ctx.drawImage(SC.img,-cx,-cy);
  for(const [mx_,my_] of SC.marks){if(Math.hypot(pl.x-mx_,pl.y-my_)<45&&Math.floor(t*2.5)%2===0){const X=mx_-cx-3,Y=my_-cy-2,dr=SC.exits[0].dir;ctx.fillStyle='#f4e8c8';for(let k=0;k<4;k++){if(dr==='down')ctx.fillRect(X+k,Y+k,7-2*k,1);else if(dr==='up')ctx.fillRect(X+k,Y+3-k,7-2*k,1);else if(dr==='left')ctx.fillRect(X+3-k,Y-1+k,1,7-2*k);else ctx.fillRect(X+k,Y-1+k,1,7-2*k)}}}}
 else{const t0x=Math.floor(cx/16),t0y=Math.floor(cy/16);for(let ty=t0y;ty<=t0y+15;ty++)for(let tx=t0x;tx<=t0x+15;tx++)ctx.drawImage(TILES[tileAt(tx,ty)],tx*16-cx,ty*16-cy)}
 const sh=(x,y,w)=>{ctx.fillStyle=SC?SC.shadow:'#6e9e46';ctx.fillRect(Math.round(x-w/2-cx),Math.round(y-cy-1),w,2);ctx.fillRect(Math.round(x-w/2+2-cx),Math.round(y-cy-2),w-4,4)};
 const ents=(SC?[{k:'pl',y:pl.y}]:[...trees,...rocks,...crates.filter(c=>!c.broken),{k:'pl',y:pl.y}]).sort((a,b)=>a.y-b.y);
 for(const e of ents){
  if(e.k==='tree'){sh(e.x,e.y,30);ctx.drawImage(TREE,Math.round(e.x-26-cx),Math.round(e.y-62-cy))}
  else if(e.k==='rock'){ctx.drawImage(ROCK,Math.round(e.x-7-cx),Math.round(e.y-9-cy))}
  else if(e.k==='crate'){sh(e.x,e.y,14);const ox=e.shake>0?(Math.random()<.5?-1:1):0;ctx.drawImage(e.flash>0?CRATE_W:CRATE,Math.round(e.x-8-cx+ox),Math.round(e.y-16-cy))}
  else{sh(pl.x,pl.y,18);const {n,f}=curFrame();let rx=0,ry=0;
   if(pl.shootT>.2){const M={right:[-1,0],left:[1,0],down:[0,-1],up:[0,1]}[pl.dir];rx=M[0];ry=M[1]}
   const S=SPR[n],ti=SC&&SC.tint?1:0,lv=Math.max(-3,Math.min(3,Math.round(tailS))),L=pl.dir==='left',W=f.w+6;
   const X=Math.round(pl.x-(L?f.w-f.ax:f.ax)-cx+rx)-3,Y=Math.round(pl.y-f.ay-cy+ry)-3;
   const TL=S.tail?((pl.moving&&pl.running)?S.wave[Math.floor(t*15)%6][ti]:S.tail[lv][ti]):null;
   const lay=TL?(n[0]==='u'?[S.body[ti],TL]:[TL,S.body[ti]]):[S.body[ti]];
   for(const img of lay){if(L){ctx.save();ctx.translate(X+W,Y);ctx.scale(-1,1);ctx.drawImage(img,0,0);ctx.restore()}else ctx.drawImage(img,X,Y)}
   if(SC&&!dlg&&nearHS()&&Math.floor(t*2.5)%2===0){const bx=Math.round(pl.x-cx)-3,byy=Y+3-11;ctx.fillStyle='#1e161e';ctx.fillRect(bx,byy,7,10);ctx.fillStyle='#f4f0e6';ctx.fillRect(bx+1,byy+1,5,8);ctx.fillStyle='#b9473c';ctx.fillRect(bx+3,byy+2,1,4);ctx.fillRect(bx+3,byy+7,1,1)}}}
 if(scene==='street')drawCars(cx);
 for(const b of bullets){const x=Math.round(b.x-cx),y=Math.round(b.y-cy);ctx.fillStyle='#fff6c0';ctx.fillRect(x,y,b.vx?3:1,b.vx?1:3);ctx.fillStyle='#f0a040';ctx.fillRect(x-Math.sign(b.vx)*2,y-Math.sign(b.vy)*2,1,1)}
 for(const p of parts){ctx.globalAlpha=Math.min(1,p.life/p.max*1.5);ctx.fillStyle=p.col;const s=p.sz*(p.g?1:(1+(1-p.life/p.max)*2))|0;ctx.fillRect(Math.round(p.x-cx-s/2),Math.round(p.y-cy-s/2),s,s)}ctx.globalAlpha=1;
 if(pl.muz&&pl.muz.t>0){const m=pl.muz,x=Math.round(m.x-cx),y=Math.round(m.y-cy);ctx.fillStyle='#fff8d0';ctx.fillRect(x-1,y-1,3,3);ctx.fillStyle='#ffd040';
  ctx.fillRect(x+m.vx*3-1,y+m.vy*3-1,3,3);ctx.fillRect(x+m.vx*5,y+m.vy*5,1,1);ctx.fillRect(x-1+(m.vy?-2:0),y-1+(m.vx?-2:0),1,1);ctx.fillRect(x+1+(m.vy?2:0),y+1+(m.vx?2:0),1,1)}
 if(fade){const a_=fade.t<.3?fade.t/.3:Math.max(0,1-(fade.t-.3)/.3);ctx.globalAlpha=Math.min(1,a_);ctx.fillStyle='#000';ctx.fillRect(0,0,V,V);ctx.globalAlpha=1}
}
const lblA=document.getElementById('lblA');let lastLbl='Disparar';
let last=performance.now();function loop(n){const want=(!dlg&&nearHS())?'Examinar':dlg?'Continuar':'Disparar';if(want!==lastLbl){lastLbl=want;lblA.textContent=want}const dt=Math.max(0,Math.min(.05,(n-last)/1000));last=n;update(dt);draw();dlgDraw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
