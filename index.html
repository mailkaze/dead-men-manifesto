function tintCanvas(img,w,h){const c=mk(w,h),x=c.getContext('2d');x.drawImage(img,0,0);const id=x.getImageData(0,0,w,h),d=id.data;for(let i=0;i<d.length;i+=4){d[i]=Math.min(255,d[i]*.92+8);d[i+1]=d[i+1]*.82;d[i+2]=d[i+2]*.8}x.putImageData(id,0,0);return c}
for(const v of VEH){v.B=new Image();v.S=new Image();v.B.onload=()=>{v.BT=tintCanvas(v.B,v.w,v.h)};v.S.onload=()=>{v.ST=tintCanvas(v.S,v.S.width,v.S.height)};v.B.src=v.body;v.S.src=v.strip}
const LANES=[{y:GY+77,dir:-1},{y:GY+105,dir:1}];let cars=[],laneT=[1.5,3.5];
function trafficUpdate(dt,cx){
 for(let l=0;l<2;l++){laneT[l]-=dt;if(laneT[l]<=0){laneT[l]=2.2+Math.random()*4.5;const v=VEH[Math.floor(Math.random()*VEH.length)],L=LANES[l],x=L.dir<0?cx+V+20:cx-v.w-20;
  if(!cars.some(c=>c.l===l&&(L.dir<0?c.x+c.k.w>x-60:c.x<x+v.w+60)))cars.push({l,x,k:v,v:v.speed[0]+Math.random()*(v.speed[1]-v.speed[0]),cur:0,d:0,seed:Math.random()*9,pt:0})}}
 for(const c of cars){const L=LANES[c.l];let sp=c.v;for(const o of cars)if(o!==c&&o.l===c.l){const gap=L.dir>0?o.x-(c.x+c.k.w):c.x-(o.x+o.k.w);if(gap>-5&&gap<28)sp=Math.min(sp,o.cur||o.v)}
  c.cur=sp;c.x+=L.dir*sp*dt;c.d+=sp*dt;
  if(c.k.exhaust){c.pt-=dt;if(c.pt<=0){c.pt=.12+Math.random()*.15;const rx=L.dir>0?c.x+3:c.x+c.k.w-3;parts.push({x:rx,y:L.y-9,vx:-L.dir*(10+Math.random()*10),vy:-6-Math.random()*6,g:0,life:.6,max:.6,col:'#8a8090',sz:1})}}}
 cars=cars.filter(c=>c.x>cx-c.k.w-320&&c.x<cx+V+320)}
function drawCars(cx){const order=[...cars].sort((a,b)=>a.l-b.l);
 for(const c of order){const v=c.k;if(!v.BT||!v.ST)continue;const L=LANES[c.l],X=Math.round(c.x-cx),Y=L.y-v.wb;if(X>V||X+v.w<0)continue;
  ctx.fillStyle='rgba(10,6,14,.38)';ctx.fillRect(X+8,L.y-3,v.w-16,4);ctx.fillRect(X+14,L.y+1,v.w-28,2);
  const bob=Math.round(Math.sin(c.d*.13+c.seed)*.6),fr=Math.floor(c.d/v.r/(Math.PI/6))%12,flip=L.dir<0;
  ctx.save();if(flip){ctx.translate(X+v.w,0);ctx.scale(-1,1)}else ctx.translate(X,0);
  ctx.drawImage(v.BT,0,Y+bob);v.wheels.forEach((wd,k)=>ctx.drawImage(v.ST,fr*v.fw,k*v.fh,wd.w,wd.h,wd.x,Y+wd.y,wd.w,wd.h));ctx.restore()}}


function inPoly(x,y,P=(SCN[scene]||{}).poly||RPOLY){let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const [xi,yi]=P[i],[xj,yj]=P[j];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))c=!c}return c}
function nearHS(){const SC=SCN[scene];if(!SC)return null;if(SC.hsFn)return SC.hsFn();let best=null,bd=1e9;for(const h of SC.hs){const d=Math.hypot(pl.x-h.x,pl.y-h.y);if(d<h.r&&d<bd){bd=d;best=h}}return best}

function setScene(s,spawn){scene=s;bullets=[];parts=[];cars=[];laneT=[1.2,2.8];pl.shootT=0;
 if(SCN[s]){lastStory=s;const sp=spawn||(s==='room'?[150,126,'down']:[150,100,'down']);pl.x=sp[0];pl.y=sp[1];pl.dir=sp[2]}
 else{pl.x=240;pl.y=260;pl.dir='down';if(!fieldIntro){fieldIntro=true;say(['JESSICA: Campo de pruebas. Esas cajas no deberían estar aquí... Voy a revisarlas.'])}}
 document.getElementById('scn').textContent=SCN[s]?'Ir al campo de pruebas ▸':'◂ Volver a la historia'}
function startFade(to,spawn){fade={t:0,to,spawn,done:false};pl.cd=.4}

function update(dt){t+=dt;if(fade){fade.t+=dt;if(!fade.done&&fade.t>=.3){fade.done=true;setScene(fade.to,fade.spawn)}if(fade.t>=.62)fade=null;inp.aPress=false;return}
 if(dlgUpdate(dt)){pl.moving=false;for(const p of parts){p.life-=dt}parts=parts.filter(p=>p.life>0);return}let mx=inp.jx,my=inp.jy;
 const kx=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0),ky=(keys.ArrowDown||keys.KeyS?1:0)-(keys.ArrowUp||keys.KeyW?1:0);if(kx||ky){mx=kx;my=ky}
 const m=Math.min(1,Math.hypot(mx,my));
 if(pl.cd>0)pl.cd-=dt;if(pl.shootT>0)pl.shootT-=dt;
 const hs=nearHS();if(inp.aPress&&hs&&pl.shootT<=0){inp.aPress=false;inp.a=false;say(hs.t);return}
 if((inp.aPress||inp.a!==false)&&pl.cd<=0&&!hs)shoot();inp.aPress=false;
 const moving=m>0.15;
 if(m>0.15&&pl.shootT<=0.02){if(Math.abs(mx)>Math.abs(my)*1.1){pl.dir=mx>0?'right':'left'}else{pl.dir=my>0?'down':'up'}}
 if(moving){const run=inp.b!==false||runLock,sp=(run?125:73)*Math.max(.55,m)*(pl.shootT>0?.85:1),n=Math.hypot(mx,my)||1,dx=mx/n*sp*dt,dy=my/n*sp*dt;
  if(!hitSolid(pl.x+dx,pl.y))pl.x+=dx;if(!hitSolid(pl.x,pl.y+dy))pl.y+=dy;
  pl.walkT+=dt*(run?17:11);const fi=Math.floor(pl.walkT)%4;if(fi!==pl.lastStep){pl.lastStep=fi;if(fi===0||fi===2)puff(pl.x+(fi?3:-3),pl.y-1,run?5:2,SCN[scene]?SCN[scene].dust:'#d8d0a8',run?18:10,.3)}}
 else{pl.walkT=0;pl.lastStep=-1}
 pl.moving=moving;pl.running=inp.b!==false||runLock;
 {const SC=SCN[scene];if(SC&&moving)for(const e of SC.exits)if(pl.x>=e.x0&&pl.x<=e.x1&&pl.y>=e.y0&&pl.y<=e.y1&&(e.dir==='down'?my>.3:e.dir==='up'?my<-.3:e.dir==='left'?mx<-.3:mx>.3)){startFade(e.to,e.spawn);break}}
 {const side=pl.dir==='left'||pl.dir==='right';let tg=moving?(pl.running?2.6:1.7)*Math.sin(pl.walkT*Math.PI/2):0.8*Math.sin(t*2.2);if(moving&&side&&!pl.running)tg-=0.9;

 const ents=(SC?[{k:'pl',y:pl.y}]:[...trees,...rocks,...crates.filter(c=>!c.broken),{k:'pl',y:pl.y}]).sort((a,b)=>a.y-b.y);

   if(SC&&!dlg&&nearHS()&&Math.floor(t*2.5)%2===0){const bx=Math.round(pl.x-cx)-3,byy=Y+3-11;ctx.fillStyle='#1e161e';ctx.fillRect(bx,byy,7,10);ctx.fillStyle='#f4f0e6';ctx.fillRect(bx+1,byy+1,5,8);ctx.fillStyle='#b9473c';ctx.fillRect(bx+3,byy+2,1,4);ctx.fillRect(bx+3,byy+7,1,1)}}}
 if(scene==='street')drawCars(cx);
 for(const b of bullets){const x=Math.round(b.x-cx),y=Math.round(b.y-cy);ctx.fillStyle='#fff6c0';ctx.fillRect(x,y,b.vx?3:1,b.vx?1:3);ctx.fillStyle='#f0a040';ctx.fillRect(x-Math.sign(b.vx)*2,y-Math.sign(b.vy)*2,1,1)}
