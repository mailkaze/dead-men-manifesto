<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Dead Men Manifesto</title>
<style>
html,body{margin:0;height:100%;background:#16131c;color:#d9cfbd;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{display:flex;flex-direction:column;height:100%;height:100dvh;max-width:520px;margin:0 auto}
#wrap{padding:max(10px,env(safe-area-inset-top)) 10px 0}
#screen{width:100%;aspect-ratio:1/1;image-rendering:pixelated;image-rendering:crisp-edges;display:block;border-radius:8px;background:#000;box-shadow:0 0 0 3px #2a2433,0 8px 24px #0008}
#txt{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;pointer-events:none}
#scn{position:absolute;top:34px;left:50%;transform:translateX(-50%);background:#2c2638;border:1px solid #ffffff22;border-radius:16px;padding:7px 14px;font-size:12px;font-weight:600;white-space:nowrap;color:#e8dcc4}
#pad{flex:1;position:relative;min-height:230px}
#hint{position:absolute;top:8px;left:0;right:0;text-align:center;font-size:11px;white-space:nowrap;opacity:.55;pointer-events:none}
#joyZone{position:absolute;left:0;top:0;bottom:0;width:55%}
.joy{position:absolute;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%)}
#joyBase{width:116px;height:116px;background:#ffffff10;border:2px solid #ffffff30}
#joyKnob{width:52px;height:52px;background:#d9cfbd;opacity:.85;box-shadow:0 3px 0 #0006}
.btn{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#f6eedc;box-shadow:0 5px 0 #0009;transition:transform .05s}
.btn.on{transform:translateY(4px);box-shadow:0 1px 0 #0009}
.btn span{position:absolute;bottom:-22px;font-size:11px;font-weight:600;opacity:.6;white-space:nowrap}
#btnA{width:86px;height:86px;right:20px;bottom:calc(96px + env(safe-area-inset-bottom));background:#b9473c;font-size:28px}
#btnB.lock{background:#d9952e;box-shadow:0 0 0 4px #d9952e55,0 5px 0 #0009}
#btnB .up{position:absolute;top:-17px;bottom:auto;font-size:12px;opacity:.45}
#btnB{width:64px;height:64px;right:118px;bottom:calc(46px + env(safe-area-inset-bottom));background:#3d6f8c;font-size:22px}
</style></head><body>
<div id="app">
 <div id="wrap"><div style="position:relative"><canvas id="screen" width="224" height="224"></canvas><canvas id="txt" width="448" height="448"></canvas></div></div>
 <div id="pad">
  <div id="hint">Joystick a la izquierda · A dispara o examina · B corre (▲ arrastra para fijar)</div>
  <div id="scn">Ir al campo de pruebas ▸</div>
  <div id="joyZone"></div>
  <div id="joyBase" class="joy"></div><div id="joyKnob" class="joy"></div>
  <div id="btnB" class="btn">B<span class="up">▲</span><span id="lblB">Correr</span></div>
  <div id="btnA" class="btn">A<span id="lblA">Disparar</span></div>
 </div>
</div>
<script type="module" src="/src/main.ts"></script>
</body></html>
